name: Publish Python Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Which packages to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ison-py
          - ison-cli
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: true
        type: boolean

jobs:
  publish-ison-py:
    name: Publish ison-py
    runs-on: ubuntu-latest
    if: ${{ inputs.packages == 'all' || inputs.packages == 'ison-py' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # PyPI never allows a version to be overwritten, so re-running with an
      # already-published version should skip rather than fail on a 400.
      - name: Preflight version check
        id: preflight
        working-directory: ison-py
        run: |
          set -uo pipefail
          VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          HEAD="$(grep -m1 '^## \[' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')"

          if [ "$VERSION" != "$HEAD" ]; then
            echo "::error::ison-py version ($VERSION) != CHANGELOG head ($HEAD)"
            exit 1
          fi

          if [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ison-py/$VERSION/json")" = "200" ]; then
            echo "ison-py $VERSION is already on PyPI — nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "ison-py $VERSION ready to publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: ${{ steps.preflight.outputs.skip != 'true' }}
        working-directory: ison-py
        run: python -m build

      - name: Check package
        if: ${{ steps.preflight.outputs.skip != 'true' }}
        working-directory: ison-py
        run: twine check dist/*

      - name: Publish to PyPI
        if: ${{ inputs.dry_run != true && steps.preflight.outputs.skip != 'true' }}
        working-directory: ison-py
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Dry run - show what would be published
        if: ${{ inputs.dry_run == true && steps.preflight.outputs.skip != 'true' }}
        working-directory: ison-py
        run: |
          echo "Would publish:"
          ls -la dist/

  # ison-cli depends on ison-py being present on PyPI, not on this run having
  # published it. `needs` only orders the jobs; the gate deliberately omits
  # !failure() so an already-published ison-py cannot block the CLI.
  publish-ison-cli:
    name: Publish ison-cli
    runs-on: ubuntu-latest
    needs: publish-ison-py
    if: ${{ always() && !cancelled() && (inputs.packages == 'all' || inputs.packages == 'ison-cli') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # Same gate as release-all.yml: metadata must match the CHANGELOG head,
      # and PyPI never allows a version to be overwritten.
      - name: Preflight version check
        working-directory: ison-cli
        run: |
          set -uo pipefail
          VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          HEAD="$(grep -m1 '^## \[' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')"

          if [ "$VERSION" != "$HEAD" ]; then
            echo "::error::ison-cli version ($VERSION) != CHANGELOG head ($HEAD)"
            exit 1
          fi
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ison-cli/$VERSION/json")" = "200" ]; then
            echo "::error::ison-cli $VERSION is already on PyPI; it cannot be overwritten"
            exit 1
          fi
          echo "ison-cli $VERSION ready to publish"

      - name: Run tests
        working-directory: ison-cli
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q

      - name: Wait for PyPI propagation
        if: ${{ inputs.packages == 'all' && inputs.dry_run != true }}
        run: sleep 60

      - name: Build package
        working-directory: ison-cli
        run: python -m build

      - name: Check package
        working-directory: ison-cli
        run: twine check dist/*

      - name: Publish to PyPI
        if: ${{ inputs.dry_run != true }}
        working-directory: ison-cli
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Dry run - show what would be published
        if: ${{ inputs.dry_run == true }}
        working-directory: ison-cli
        run: |
          echo "Would publish:"
          ls -la dist/
